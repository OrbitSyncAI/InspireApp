# ============================================================
#  InspireApp — Ultimate Multi-Platform Production Pipeline
#  Targets: Windows EXE | macOS DMG | Linux AppImage |
#           Android APK | iOS IPA Framework
#  Trigger build: update configuration
# ============================================================

name: 🚀 Multi-Platform Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  JAVA_VERSION: "21"
  APP_NAME: "InspireApp"
  ELECTRON_VERSION: "31"

jobs:
  # ===========================================================================
  # JOB 1 ─ Build the Vite web bundle
  # ===========================================================================
  build-web:
    name: 🌐 Vite Web Bundle
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout source
        uses: actions/checkout@v4

      - name: ⚡ Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci --prefer-offline

      - name: 🔨 Vite production build
        run: npm run build

      - name: 📤 Upload web dist
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist/
          retention-days: 1
          if-no-files-found: error

  # ===========================================================================
  # JOB 2 ─ Desktop builds (Windows / macOS / Linux) via Electron Builder
  # ===========================================================================
  build-desktop:
    name: 🖥️ Desktop — ${{ matrix.os-name }}
    needs: build-web
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            os-name: Windows
            platform: win
            artifact-name: windows-exe

          - runner: macos-latest
            os-name: macOS
            platform: mac
            artifact-name: macos-dmg

          - runner: ubuntu-latest
            os-name: Linux
            platform: linux
            artifact-name: linux-appimage

    runs-on: ${{ matrix.runner }}
    steps:
      - name: ⬇️ Checkout source
        uses: actions/checkout@v4

      - name: ⚡ Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: 📥 Download web dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist/

      - name: 🗄️ Cache Electron binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/Library/Caches/electron
            ~\AppData\Local\electron\Cache
          key: electron-${{ env.ELECTRON_VERSION }}-${{ matrix.runner }}

      # Scaffold exact production assets direct in dist
      - name: 🔧 Scaffold Electron Wrapper in Dist
        shell: bash
        run: |
          cat > dist/main.js << 'EOJS'
          const { app, BrowserWindow } = require('electron');
          const path = require('path');
          let win;
          function createWindow() {
            win = new BrowserWindow({
              width: 1280,
              height: 800,
              webPreferences: { contextIsolation: true },
              title: 'InspireApp',
              autoHideMenuBar: true,
            });
            win.loadFile(path.join(__dirname, 'index.html'));
          }
          app.whenReady().then(createWindow);
          app.on('window-all-closed', () => { if (process.platform !== 'darwin') app.quit(); });
          app.on('activate', () => { if (BrowserWindow.getAllWindows().length === 0) createWindow(); });
          EOJS

          cat > dist/package.json << 'EOJSON'
          {
            "name": "inspire-app",
            "version": "1.0.0",
            "main": "main.js",
            "author": "OrbitSyncAI",
            "description": "InspireApp Desktop Application",
            "repository": {
              "type": "git",
              "url": "https://github.com/OrbitSyncAI/InspireApp.git"
            },
            "private": true
          }
          EOJSON

      - name: 📦 Install Electron + Builder
        shell: bash
        run: npm install --save-dev electron@${{ env.ELECTRON_VERSION }} electron-builder@latest --prefer-offline

      # Fixed: Added explicit projectDir mapping to 'dist' folder so asset references never break
      - name: 🏗️ Build desktop app — ${{ matrix.os-name }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ELECTRON_VER=$(node -p "require('electron/package.json').version")
          echo "Installed Electron Version: $ELECTRON_VER"
          npx electron-builder --${{ matrix.platform }} --projectDir="dist" --config.electronVersion="$ELECTRON_VER" --config.appId="ai.orbitsync.inspireapp" --config.productName="InspireApp" --config.directories.output="../release" --config.win.target="nsis" --config.mac.target="dmg" --config.linux.target="AppImage" --config.publish=null --publish never

      - name: 📤 Upload ${{ matrix.os-name }} binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: release/
          if-no-files-found: warn
          retention-days: 7

  # ===========================================================================
  # JOB 3 ─ Android APK via Capacitor + Gradle
  # ===========================================================================
  build-android:
    name: 🤖 Android APK
    needs: build-web
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout source
        uses: actions/checkout@v4

      - name: ⚡ Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: ☕ Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}

      - name: 📱 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: ✅ Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: 🗄️ Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: 📥 Download web dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist/

      - name: 📦 Install dependencies + Capacitor CLI
        run: |
          npm ci --prefer-offline
          npm install --save-dev @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest --prefer-offline

      - name: 🔧 Initialize Capacitor & add Android platform
        run: |
          npx cap init "InspireApp" "ai.orbitsync.inspireapp" --web-dir dist
          npx cap add android

      - name: 🔄 Sync Capacitor
        run: npx cap sync android

      - name: 🏗️ Build Android debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --parallel --build-cache -Dorg.gradle.jvmargs="-Xmx4g -XX:+UseParallelGC"

      - name: 📤 Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 7

  # ===========================================================================
  # JOB 4 ─ iOS IPA Framework via Capacitor + Xcode
  # ===========================================================================
  build-ios:
    name: 🍎 iOS IPA Framework
    needs: build-web
    runs-on: macos-latest
    steps:
      - name: ⬇️ Checkout source
        uses: actions/checkout@v4

      - name: ⚡ Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: 📥 Download web dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist/

      - name: 📦 Install dependencies + Capacitor iOS
        run: |
          npm ci --prefer-offline
          npm install --save-dev @capacitor/core@latest @capacitor/cli@latest @capacitor/ios@latest --prefer-offline

      - name: 🔧 Initialize Capacitor & add iOS platform
        run: |
          npx cap init "InspireApp" "ai.orbitsync.inspireapp" --web-dir dist
          npx cap add ios

      - name: 🔄 Sync Capacitor
        run: npx cap sync ios

      - name: 🛠️ Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: 🏗️ Xcode Archive (unsigned)
        run: |
          xcodebuild archive -workspace ios/App/App.xcworkspace -scheme App -configuration Release -archivePath ios/App/build/InspireApp.xcarchive CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO SKIP_INSTALL=NO | xcpretty || true

      - name: 📦 Export app framework
        run: |
          mkdir -p ios/App/build/Payload
          cp -r "ios/App/build/InspireApp.xcarchive/Products/Applications/App.app" "ios/App/build/Payload/App.app" || true
          cd ios/App/build
          zip -r InspireApp-iOS.ipa Payload/ || true

      - name: 📤 Upload iOS IPA/Framework
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: |
            ios/App/build/InspireApp-iOS.ipa
            ios/App/build/InspireApp.xcarchive/
          if-no-files-found: warn
          retention-days: 7

  # ===========================================================================
  # JOB 5 ─ Aggregate all outputs into ONE downloadable release bundle
  # ===========================================================================
  bundle-release:
    name: 📦 Bundle All Platforms → Release
    needs: [build-desktop, build-android, build-ios]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: 📥 Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-builds/

      - name: 🗂️ Organize release bundle
        run: |
          mkdir -p release-bundle/{windows,macos,linux,android,ios}
          cp -r all-builds/windows-exe/* release-bundle/windows/   2>/dev/null || true
          cp -r all-builds/macos-dmg/* release-bundle/macos/     2>/dev/null || true
          cp -r all-builds/linux-appimage/* release-bundle/linux/    2>/dev/null || true
          cp -r all-builds/android-apk/* release-bundle/android/   2>/dev/null || true
          cp -r all-builds/ios-ipa/* release-bundle/ios/        2>/dev/null || true

      - name: 📤 Upload unified release bundle
        uses: actions/upload-artifact@v4
        with:
          name: InspireApp-All-Platforms-${{ github.sha }}
          path: release-bundle/
          retention-days: 30
          if-no-files-found: warn

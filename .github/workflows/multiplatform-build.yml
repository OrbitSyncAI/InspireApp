# ============================================================
#  InspireApp — Multi-Platform Production Pipeline
#  Targets: Windows EXE | macOS DMG | Linux AppImage |
#           Android APK | iOS IPA (unsigned, best-effort)
# ============================================================

name: Multi-Platform Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

env:
  NODE_VERSION: "22"
  JAVA_VERSION: "21"
  APP_NAME: "InspireApp"
  # Pin exact Electron version (electron-builder rejects ranges)
  ELECTRON_VERSION: "31.7.7"
  RELEASE_VERSION: "1.2.${{ github.run_number }}"

jobs:
  # ===========================================================================
  # JOB 1 — Vite web bundle
  # ===========================================================================
  build-web:
    name: Vite Web Bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Vite production build
        env:
          VITE_APP_VERSION: ${{ env.RELEASE_VERSION }}
          VITE_APP_BUILD: ${{ github.run_number }}-${{ github.sha }}
          VITE_APP_PLATFORM: web
        run: npm run build

      - name: Upload web dist
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist/
          retention-days: 1
          if-no-files-found: error

  # ===========================================================================
  # JOB 2 — Desktop (Windows / macOS / Linux) via Electron Builder
  # ===========================================================================
  build-desktop:
    name: Desktop — ${{ matrix.os-name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            os-name: Windows
            platform: win
            artifact-name: windows-exe

          - runner: macos-latest
            os-name: macOS
            platform: mac
            artifact-name: macos-zip

          - runner: ubuntu-latest
            os-name: Linux
            platform: linux
            artifact-name: linux-appimage

    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Cache Electron binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/Library/Caches/electron
            ~\AppData\Local\electron\Cache
          key: electron-${{ env.ELECTRON_VERSION }}-${{ matrix.runner }}

      - name: Install project deps + Electron tooling
        shell: bash
        run: |
          npm ci --prefer-offline
          # Retry electron download (GitHub/CDN 504s are common on macOS runners)
          set +e
          for attempt in 1 2 3 4 5; do
            echo "Electron install attempt $attempt..."
            npm install --save-dev "electron@${{ env.ELECTRON_VERSION }}" electron-builder@25.1.8 --prefer-offline --no-fund --no-audit
            if [ $? -eq 0 ]; then
              echo "Electron install succeeded on attempt $attempt"
              set -e
              exit 0
            fi
            echo "Attempt $attempt failed; sleeping before retry..."
            sleep $((attempt * 15))
          done
          set -e
          echo "Electron install failed after retries"
          exit 1

      - name: Build web bundle for ${{ matrix.os-name }}
        shell: bash
        env:
          VITE_APP_VERSION: ${{ env.RELEASE_VERSION }}
          VITE_APP_BUILD: ${{ github.run_number }}-${{ github.sha }}-${{ matrix.platform }}
          VITE_APP_PLATFORM: ${{ matrix.platform }}
        run: npm run build

      - name: Scaffold Electron main process + builder config
        shell: bash
        run: |
          cat > electron-main.cjs << 'EOJS'
          const { app, BrowserWindow, ipcMain, shell } = require('electron');
          const fs = require('fs');
          const http = require('http');
          const https = require('https');
          const path = require('path');

          app.setAppUserModelId('ai.orbitsync.inspireapp');

          function createWindow() {
            const win = new BrowserWindow({
              width: 1280,
              height: 800,
              minWidth: 1024,
              minHeight: 680,
              backgroundColor: '#f8f9fc',
              titleBarStyle: process.platform === 'darwin' ? 'hiddenInset' : 'default',
              trafficLightPosition: process.platform === 'darwin' ? { x: 18, y: 18 } : undefined,
              webPreferences: {
                contextIsolation: true,
                nodeIntegration: false,
                sandbox: true,
                preload: path.join(__dirname, 'preload.cjs'),
              },
              title: 'InspireApp',
              autoHideMenuBar: true,
              show: false,
            });
            win.setMenuBarVisibility(false);
            win.once('ready-to-show', () => win.show());
            win.loadFile(path.join(__dirname, 'dist', 'index.html'));
          }

          app.whenReady().then(createWindow);
          app.on('window-all-closed', () => {
            if (process.platform !== 'darwin') app.quit();
          });
          app.on('activate', () => {
            if (BrowserWindow.getAllWindows().length === 0) createWindow();
          });

          function safeFileName(name) {
            return String(name || 'InspireApp-update').replace(/[^a-zA-Z0-9._-]+/g, '-');
          }

          function downloadFile(url, destination, redirects = 0) {
            return new Promise((resolve, reject) => {
              const client = url.startsWith('https:') ? https : http;
              const request = client.get(url, { headers: { 'User-Agent': 'InspireApp' } }, response => {
                if ([301, 302, 303, 307, 308].includes(response.statusCode) && response.headers.location && redirects < 5) {
                  response.resume();
                  resolve(downloadFile(new URL(response.headers.location, url).toString(), destination, redirects + 1));
                  return;
                }
                if (response.statusCode < 200 || response.statusCode >= 300) {
                  response.resume();
                  reject(new Error(`Download failed: ${response.statusCode}`));
                  return;
                }
                const file = fs.createWriteStream(destination);
                response.pipe(file);
                file.on('finish', () => file.close(() => resolve(destination)));
                file.on('error', reject);
              });
              request.on('error', reject);
            });
          }

          ipcMain.handle('inspire-download-update', async (_event, payload) => {
            const url = payload && payload.url;
            if (!url) throw new Error('Missing update URL');
            const fileName = safeFileName(payload.fileName || path.basename(new URL(url).pathname));
            const destination = path.join(app.getPath('downloads'), fileName);
            await downloadFile(url, destination);
            await shell.openPath(destination);
            return { started: true, path: destination };
          });
          EOJS

          cat > preload.cjs << 'EOPRELOAD'
          const { contextBridge, ipcRenderer } = require('electron');

          contextBridge.exposeInMainWorld('InspireUpdater', {
            downloadAndInstall(payload) {
              return ipcRenderer.invoke('inspire-download-update', payload);
            },
          });
          EOPRELOAD

          cat > electron-builder.yml << 'EOYML'
          appId: ai.orbitsync.inspireapp
          productName: InspireApp
          copyright: Copyright © OrbitSyncAI
          directories:
            output: release
            buildResources: build
          files:
            - dist/**/*
            - electron-main.cjs
            - preload.cjs
            - package.json
          extraMetadata:
            main: electron-main.cjs
          asar: true
          win:
            target:
              - target: nsis
                arch: [x64]
            artifactName: InspireApp-Setup-${version}.${ext}
            legalTrademarks: InspireApp
          nsis:
            oneClick: false
            allowToChangeInstallationDirectory: true
            createDesktopShortcut: true
            createStartMenuShortcut: true
            shortcutName: InspireApp
          mac:
            target:
              - target: zip
                arch: [x64, arm64]
            artifactName: InspireApp-${version}-mac.${ext}
            identity: null
            hardenedRuntime: false
            gatekeeperAssess: false
          linux:
            target:
              - target: AppImage
                arch: [x64]
            category: Utility
            artifactName: InspireApp-${version}-linux.${ext}
          EOYML

          # Ensure package.json has description/author for electron-builder
          node << 'EONODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.main = 'electron-main.cjs';
          pkg.version = process.env.RELEASE_VERSION || pkg.version;
          pkg.description = pkg.description || 'InspireApp Desktop Application';
          pkg.author = pkg.author || 'OrbitSyncAI';
          pkg.repository = pkg.repository || { type: 'git', url: 'https://github.com/OrbitSyncAI/InspireApp.git' };
          // Remove ESM type for main process packaging clarity (app still ships built dist)
          delete pkg.type;
          // Never set publish:null as a string provider — omit publish entirely
          delete pkg.publish;
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          EONODE

      - name: Build desktop app — ${{ matrix.os-name }}
        shell: bash
        env:
          # Do not auto-discover code signing certs
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          # Prevent electron-builder from trying to publish
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx electron-builder --${{ matrix.platform }} \
            --config electron-builder.yml \
            --config.electronVersion=${{ env.ELECTRON_VERSION }} \
            --publish never

      - name: List release outputs
        shell: bash
        run: |
          echo "=== release/ ==="
          ls -laR release/ || true

      - name: Upload ${{ matrix.os-name }} binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.zip
            release/*.blockmap
            release/*.yml
            release/*.yaml
          if-no-files-found: warn
          retention-days: 14

  # ===========================================================================
  # JOB 3 — Android APK (Capacitor + Gradle)
  # ===========================================================================
  build-android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Cache Android update signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/inspire-update.keystore
          key: android-update-keystore-v1

      - name: Ensure Android update signing key
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/inspire-update.keystore ]; then
            keytool -genkeypair \
              -storetype JKS \
              -keystore ~/.android/inspire-update.keystore \
              -storepass inspireUpdatePass \
              -keypass inspireUpdatePass \
              -alias inspireupdate \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=InspireApp, OU=OrbitSyncAI, O=OrbitSyncAI, L=Raebareli, S=UP, C=IN"
          fi

      - name: Install dependencies + Capacitor
        run: |
          npm ci --prefer-offline
          npm install --save-dev @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 --prefer-offline --no-fund --no-audit

      - name: Build web bundle for Android
        env:
          VITE_APP_VERSION: ${{ env.RELEASE_VERSION }}
          VITE_APP_BUILD: ${{ github.run_number }}-${{ github.sha }}-android
          VITE_APP_PLATFORM: android
        run: npm run build

      - name: Initialize Capacitor & add Android
        run: |
          if [ ! -f capacitor.config.json ] && [ ! -f capacitor.config.ts ]; then
            npx cap init "InspireApp" "ai.orbitsync.inspireapp" --web-dir dist
          fi
          npx cap add android || true
          npx cap sync android

      - name: Add Android in-app updater bridge
        run: |
          mkdir -p android/app/src/main/java/ai/orbitsync/inspireapp

          cat > android/app/src/main/java/ai/orbitsync/inspireapp/MainActivity.java << 'EOF'
          package ai.orbitsync.inspireapp;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              registerPlugin(InspireUpdaterPlugin.class);
              super.onCreate(savedInstanceState);
            }
          }
          EOF

          cat > android/app/src/main/java/ai/orbitsync/inspireapp/InspireUpdaterPlugin.java << 'EOF'
          package ai.orbitsync.inspireapp;

          import android.app.Activity;
          import android.app.DownloadManager;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.IntentFilter;
          import android.database.Cursor;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Environment;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "InspireUpdater")
          public class InspireUpdaterPlugin extends Plugin {
            @PluginMethod
            public void downloadAndInstall(PluginCall call) {
              String url = call.getString("url");
              String fileName = call.getString("fileName", "InspireApp-update.apk");
              if (url == null || url.trim().isEmpty()) {
                call.reject("Missing update URL");
                return;
              }

              Activity activity = getActivity();
              DownloadManager manager = (DownloadManager) activity.getSystemService(Context.DOWNLOAD_SERVICE);
              DownloadManager.Request request = new DownloadManager.Request(Uri.parse(url));
              request.setTitle("InspireApp update");
              request.setDescription("Downloading update package");
              request.setMimeType("application/vnd.android.package-archive");
              request.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED);
              request.setDestinationInExternalFilesDir(activity, Environment.DIRECTORY_DOWNLOADS, fileName);

              long downloadId = manager.enqueue(request);
              BroadcastReceiver receiver = new BroadcastReceiver() {
                @Override
                public void onReceive(Context context, Intent intent) {
                  long completedId = intent.getLongExtra(DownloadManager.EXTRA_DOWNLOAD_ID, -1);
                  if (completedId != downloadId) return;

                  try {
                    context.unregisterReceiver(this);
                  } catch (Exception ignored) {}

                  DownloadManager.Query query = new DownloadManager.Query().setFilterById(downloadId);
                  try (Cursor cursor = manager.query(query)) {
                    if (cursor != null && cursor.moveToFirst()) {
                      int statusIndex = cursor.getColumnIndex(DownloadManager.COLUMN_STATUS);
                      int status = statusIndex >= 0 ? cursor.getInt(statusIndex) : DownloadManager.STATUS_FAILED;
                      if (status == DownloadManager.STATUS_SUCCESSFUL) {
                        Uri apkUri = manager.getUriForDownloadedFile(downloadId);
                        openInstaller(activity, apkUri);
                        JSObject ret = new JSObject();
                        ret.put("started", true);
                        call.resolve(ret);
                        return;
                      }
                    }
                  } catch (Exception e) {
                    call.reject("Could not open installer: " + e.getMessage());
                    return;
                  }
                  call.reject("Download failed");
                }
              };

              IntentFilter filter = new IntentFilter(DownloadManager.ACTION_DOWNLOAD_COMPLETE);
              if (Build.VERSION.SDK_INT >= 33) {
                activity.registerReceiver(receiver, filter, Context.RECEIVER_NOT_EXPORTED);
              } else {
                activity.registerReceiver(receiver, filter);
              }
            }

            private void openInstaller(Activity activity, Uri uri) {
              Intent install = new Intent(Intent.ACTION_VIEW);
              install.setDataAndType(uri, "application/vnd.android.package-archive");
              install.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
              install.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
              activity.startActivity(install);
            }
          }
          EOF

          node << 'EOF'
          const fs = require('fs');
          const manifestPath = 'android/app/src/main/AndroidManifest.xml';
          let xml = fs.readFileSync(manifestPath, 'utf8');
          if (!xml.includes('android.permission.REQUEST_INSTALL_PACKAGES')) {
            xml = xml.replace('<manifest', '<manifest')
              .replace(/<application/, '    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\n    <application');
          }
          fs.writeFileSync(manifestPath, xml);
          EOF

      - name: Configure Android release signing
        run: |
          cat >> android/app/build.gradle << 'EOF'

          android {
              signingConfigs {
                  inspireRelease {
                      storeFile file(System.getProperty("user.home") + "/.android/inspire-update.keystore")
                      storePassword "inspireUpdatePass"
                      keyAlias "inspireupdate"
                      keyPassword "inspireUpdatePass"
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.inspireRelease
                      minifyEnabled false
                  }
              }
          }
          EOF

      - name: Build Android release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --parallel --build-cache -Dorg.gradle.jvmargs="-Xmx4g -XX:+UseParallelGC"

      - name: Rename APK for release clarity
        run: |
          mkdir -p out-android
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -n "$APK" ]; then
            cp "$APK" "out-android/InspireApp-${{ env.RELEASE_VERSION }}-android.apk"
            ls -la out-android/
          else
            echo "No APK found"
            exit 1
          fi

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: out-android/*.apk
          if-no-files-found: error
          retention-days: 14

  # ===========================================================================
  # JOB 4 — iOS IPA (unsigned, best-effort)
  # ===========================================================================
  build-ios:
    name: iOS IPA Framework
    runs-on: macos-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies + Capacitor iOS
        run: |
          npm ci --prefer-offline
          npm install --save-dev @capacitor/core@6 @capacitor/cli@6 @capacitor/ios@6 --prefer-offline --no-fund --no-audit

      - name: Build web bundle for iOS
        env:
          VITE_APP_VERSION: ${{ env.RELEASE_VERSION }}
          VITE_APP_BUILD: ${{ github.run_number }}-${{ github.sha }}-ios
          VITE_APP_PLATFORM: ios
        run: npm run build

      - name: Initialize Capacitor & add iOS
        run: |
          if [ ! -f capacitor.config.json ] && [ ! -f capacitor.config.ts ]; then
            npx cap init "InspireApp" "ai.orbitsync.inspireapp" --web-dir dist
          fi
          node -e "const fs=require('fs');const p='capacitor.config.json';const c=fs.existsSync(p)?JSON.parse(fs.readFileSync(p,'utf8')):{};c.appId='ai.orbitsync.inspireapp';c.appName='InspireApp';c.webDir='dist';c.ios={contentInset:'automatic',scrollEnabled:true,allowsLinkPreview:false};fs.writeFileSync(p,JSON.stringify(c,null,2));"
          npx cap add ios || true
          npx cap sync ios

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Xcode Archive (unsigned)
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild archive \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath ios/App/build/InspireApp.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            || true

      - name: Package IPA
        continue-on-error: true
        run: |
          mkdir -p ios/App/build/Payload out-ios
          if [ -d "ios/App/build/InspireApp.xcarchive/Products/Applications/App.app" ]; then
            cp -R "ios/App/build/InspireApp.xcarchive/Products/Applications/App.app" "ios/App/build/Payload/App.app"
            cd ios/App/build
            zip -r InspireApp-iOS-unsigned.ipa Payload/
            cp InspireApp-iOS-unsigned.ipa ../../../out-ios/
          else
            echo "Archive/app not found — creating placeholder note"
            echo "iOS unsigned archive was not produced (signing / Xcode constraints)." > out-ios/README-iOS.txt
          fi
          ls -la out-ios/ || true

      - name: Upload iOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: out-ios/
          if-no-files-found: warn
          retention-days: 14

  # ===========================================================================
  # JOB 5 — Bundle + GitHub Release
  # ===========================================================================
  bundle-release:
    name: Bundle All Platforms → Release
    needs: [build-web, build-desktop, build-android, build-ios]
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-builds/
          merge-multiple: false

      - name: Organize release bundle
        run: |
          mkdir -p release-bundle/{windows,macos,linux,android,ios,web}
          echo "=== Downloaded artifacts tree ==="
          find all-builds -type f | sort || true

          cp -r all-builds/windows-exe/* release-bundle/windows/ 2>/dev/null || true
          cp -r all-builds/macos-zip/* release-bundle/macos/ 2>/dev/null || true
          cp -r all-builds/linux-appimage/* release-bundle/linux/ 2>/dev/null || true
          cp -r all-builds/android-apk/* release-bundle/android/ 2>/dev/null || true
          cp -r all-builds/ios-ipa/* release-bundle/ios/ 2>/dev/null || true
          cp -r all-builds/web-dist/* release-bundle/web/ 2>/dev/null || true

          # Flat folder of shippable binaries for GitHub Release assets
          mkdir -p release-assets
          find release-bundle -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.apk' -o -name '*.ipa' -o -name '*.zip' \) -exec cp {} release-assets/ \;
          # Also include any remaining platform files
          find release-bundle -type f ! -name '*.blockmap' | while read -r f; do
            base=$(basename "$f")
            if [ ! -f "release-assets/$base" ]; then
              cp "$f" "release-assets/" 2>/dev/null || true
            fi
          done

          echo "=== Release assets ==="
          ls -la release-assets/ || true
          echo "=== Bundle tree ==="
          find release-bundle -type f | sort || true

      - name: Upload unified release bundle
        uses: actions/upload-artifact@v4
        with:
          name: InspireApp-All-Platforms-${{ github.sha }}
          path: release-bundle/
          retention-days: 30
          if-no-files-found: warn

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.RELEASE_VERSION }}
          name: InspireApp v${{ env.RELEASE_VERSION }}
          body: |
            ## InspireApp Multi-Platform Release

            **Commit:** `${{ github.sha }}`
            **Workflow run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            ### Included builds
            - Windows installer: `.exe`
            - macOS app bundle: `.zip`
            - Linux desktop app: `.AppImage`
            - Android app: release-signed `.apk`
            - iOS package: unsigned `.ipa`
            - Web bundle: browser-ready `dist` files

            Use the app's **Check for Updates** button to show the recommended download for each device.
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release-assets/*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
